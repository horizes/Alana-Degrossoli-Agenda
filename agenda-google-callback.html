<!doctype html>
<html lang="pt-BR">
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; worker-src 'self'; manifest-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; base-uri 'none'; object-src 'none'; form-action 'self'; upgrade-insecure-requests"
    />
    <meta name="apple-mobile-web-app-title" content="Alana Agenda" />
    <link rel="manifest" href="app.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Conexão Google Agenda | Alana</title>
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="stylesheet" href="assets/brand.css" />
    <link rel="stylesheet" href="assets/experience.css" />
    <meta name="theme-color" content="#6E2634" />
  </head>
  <body class="alana-agenda agenda-page">
    <main class="agenda-container">
      <img
        class="agenda-callback-logo"
        src="brand/alana-logo.svg"
        alt="Alana Degrossoli"
      />
      <section class="agenda-card">
        <p class="page-eyebrow">GOOGLE AGENDA</p>
        <h1>Conectando sua agenda.</h1>
        <p id="google-status" role="status">
          Aguarde a confirmação da sua conexão.
        </p>
        <button id="google-close" type="button" class="button primary">
          Voltar ao painel
        </button>
      </section>
    </main>
    <script src="config.js" defer></script>
    <script src="assets/icons.js" defer></script>
    <script src="assets/api.js" defer></script>
    <script src="assets/google-flow.js" defer></script>
    <script src="assets/google-callback.js" defer></script>
  </body>
</html>
